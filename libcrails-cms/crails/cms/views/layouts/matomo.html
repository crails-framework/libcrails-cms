#include <string_view>

const std::string_view @matomo_hostname;
unsigned long @matomo_id;

// END LINKING
<link rel="preconnect" href="//<%= matomo_hostname %>">
<script>
  var _paq = window._paq = window._paq || [];
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  (function() {
    _paq.push(['setTrackerUrl', '//<%= matomo_hostname %>/matomo.php']);
    _paq.push(['setSiteId', '<%= matomo_id %>']);
  })();
</script>
<script async src="//<%= matomo_hostname %>/matomo.js"></script>
